name: Deploy tutorial to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run reproducibility tests
        run: python -m pytest -q

      - name: Rebuild tutorial artifacts
        run: python scripts/build_examples.py

      - name: Rebuild executed notebooks
        run: |
          python scripts/build_notebooks.py
          for notebook in notebooks/*.ipynb; do
            python -m nbconvert --to notebook --execute --inplace "$notebook"
          done

      - name: Render case-lab pages
        run: python scripts/build_case_pages.py

      - name: Verify final site
        run: python -m pytest -q

      - name: Prepare static site
        run: |
          mkdir -p _site/references
          cp index.html _site/index.html
          cp -R assets _site/assets
          cp -R cases _site/cases
          cp -R notebooks _site/notebooks
          cp -R templates _site/templates
          cp -R examples _site/examples
          cp -R guides _site/guides
          cp references/index.html _site/references/index.html
          cp robots.txt sitemap.xml _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
