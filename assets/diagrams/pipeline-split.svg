<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560" role="img" aria-labelledby="title desc">
  <title id="title">Correct and leaky preprocessing workflows</title>
  <desc id="desc">Correct workflow splits data first, fits preprocessing on training data, and applies the learned transformation to test data. Leaky workflow fits preprocessing on all data before splitting.</desc>
  <rect width="1300" height="560" fill="#fbfcf8"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="52" y="50" fill="#17324d" font-size="24" font-weight="700">Fit preprocessing inside the training boundary</text>
    <g>
      <rect x="45" y="94" width="1210" height="184" rx="12" fill="#edf4f2" stroke="#9fd4ca"/>
      <text x="70" y="126" fill="#0b5f59" font-size="12" font-weight="800" letter-spacing="1">CORRECT PIPELINE</text>
      <g fill="#fffef9" stroke="#8dbfb6">
        <rect x="70" y="151" width="170" height="85" rx="8"/>
        <rect x="310" y="151" width="170" height="85" rx="8"/>
        <rect x="580" y="151" width="190" height="85" rx="8"/>
        <rect x="840" y="151" width="170" height="85" rx="8"/>
        <rect x="1080" y="151" width="140" height="85" rx="8"/>
      </g>
      <g fill="#17324d" font-size="13" font-weight="700">
        <text x="92" y="182">Complete dataset</text>
        <text x="332" y="182">Split by time or rows</text>
        <text x="602" y="182">Fit preprocessing</text>
        <text x="862" y="182">Apply to test data</text>
        <text x="1102" y="182">Evaluate once</text>
      </g>
      <g fill="#5f6f83" font-size="10.5">
        <text x="92" y="205">Features and target</text>
        <text x="332" y="205">Train | test</text>
        <text x="602" y="205">Impute · scale · encode</text>
        <text x="862" y="205">No refitting</text>
        <text x="1102" y="205">Holdout result</text>
      </g>
      <g fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)">
        <path d="M240 194H300"/><path d="M480 194H570"/>
        <path d="M770 194H830"/><path d="M1010 194H1070"/>
      </g>
    </g>
    <g>
      <rect x="45" y="310" width="1210" height="165" rx="12" fill="#fbe9e6" stroke="#e4aaa2"/>
      <text x="70" y="342" fill="#8f2e26" font-size="12" font-weight="800" letter-spacing="1">LEAKY PIPELINE</text>
      <g fill="#fffef9" stroke="#dfb0aa">
        <rect x="70" y="365" width="230" height="80" rx="8"/>
        <rect x="380" y="365" width="250" height="80" rx="8"/>
        <rect x="710" y="365" width="230" height="80" rx="8"/>
        <rect x="1020" y="365" width="190" height="80" rx="8"/>
      </g>
      <g fill="#17324d" font-size="13" font-weight="700">
        <text x="92" y="397">Fit imputer and scaler</text>
        <text x="402" y="397">Split the transformed data</text>
        <text x="732" y="397">Train and test</text>
        <text x="1042" y="397">Inflated confidence</text>
      </g>
      <g fill="#8f2e26" font-size="10.5">
        <text x="92" y="421">Test information enters</text>
        <text x="402" y="421">Leakage already occurred</text>
        <text x="732" y="421">Looks reproducible</text>
        <text x="1042" y="421">Evaluation is invalid</text>
      </g>
      <g fill="none" stroke="#d55e46" stroke-width="2" marker-end="url(#arrow)">
        <path d="M300 405H370"/><path d="M630 405H700"/><path d="M940 405H1010"/>
      </g>
    </g>
    <text x="52" y="523" fill="#5f6f83" font-size="11">Original tutorial diagram, aligned with scikit-learn Pipeline and ColumnTransformer concepts.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
</svg>
